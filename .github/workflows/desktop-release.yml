name: Desktop gateway release assets

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed semantic GitHub Release tag to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.repository }}-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22.23.1

jobs:
  prepare:
    name: Prepare desktop release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          raw_tag="$INPUT_TAG"
          if [[ "$EVENT_NAME" == "release" ]]; then
            raw_tag="$RELEASE_TAG"
          fi

          version="$(.github/release/normalize-release-tag.sh "$raw_tag")"
          echo "tag=v${version}" >>"$GITHUB_OUTPUT"
          echo "version=${version}" >>"$GITHUB_OUTPUT"

  package:
    name: Package desktop gateway (${{ matrix.os }}/${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # The frontend carries sharp's per-platform native module, which npm
        # installs only for the host, so each package builds on its own
        # platform. The pure Go backend would cross-compile anywhere.
        include:
          - os: darwin
            arch: arm64
            runner: macos-14
          - os: darwin
            arch: amd64
            runner: macos-15-intel
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: windows
            arch: amd64
            runner: windows-latest
          - os: windows
            arch: arm64
            runner: windows-11-arm
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          package-manager-cache: false

      - name: Build desktop package
        env:
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          deploy/desktop/package.sh "$OS" "$ARCH" "$VERSION" dist
          ls -l dist

      - name: Smoke test desktop package
        env:
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          ext="tar.gz"
          if [[ "$OS" == "windows" ]]; then
            ext="zip"
          fi
          deploy/desktop/smoke.sh "dist/tokenhub-desktop_${VERSION}_${OS}_${ARCH}.${ext}" node

      - name: Upload desktop package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tokenhub-desktop-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/tokenhub-desktop_*
          compression-level: 0
          if-no-files-found: error

  publish:
    name: Publish desktop release assets
    needs:
      - prepare
      - package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download desktop packages
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: tokenhub-desktop-*
          path: dist
          merge-multiple: true

      - name: Verify checksums and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          expected=12
          actual="$(find . -maxdepth 1 -type f -name 'tokenhub-desktop_*' | wc -l)"
          if [[ "$actual" -ne "$expected" ]]; then
            printf 'expected %s desktop assets, found %s\n' "$expected" "$actual" >&2
            ls -l >&2
            exit 1
          fi
          for sidecar in tokenhub-desktop_*.sha256; do
            sha256sum -c "$sidecar"
          done
          printf '{"version":"%s"}\n' "$VERSION" >latest.json
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$RELEASE_TAG" \
            tokenhub-desktop_* \
            latest.json \
            --clobber \
            --repo "$GITHUB_REPOSITORY"
